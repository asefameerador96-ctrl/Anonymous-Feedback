name: Build & deploy to Azure Container Apps

# On every push to main, build the Docker image in Azure Container Registry
# and roll the new image out to the Container App. Auth uses GitHub OIDC —
# no long-lived Azure credentials are stored in the repo.
#
# Required repo secrets (set once via `gh secret set`, see README):
#   AZURE_CLIENT_ID, AZURE_TENANT_ID, AZURE_SUBSCRIPTION_ID
# The deploy identity is scoped to the rg-candor resource group only, so this
# pipeline cannot touch any other Azure resources.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write   # required for OIDC federated login
  contents: read

env:
  ACR_NAME: candoracrcrkbte
  RESOURCE_GROUP: rg-candor
  CONTAINER_APP: candor-app
  IMAGE: candor

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Ensure Container Apps CLI extension
        run: az extension add --name containerapp --only-show-errors || true

      - name: Build image in Azure Container Registry
        run: az acr build --registry "$ACR_NAME" --image "$IMAGE:${{ github.sha }}" --image "$IMAGE:latest" .

      - name: Roll out new image to the Container App
        run: |
          az containerapp update \
            --name "$CONTAINER_APP" \
            --resource-group "$RESOURCE_GROUP" \
            --image "$ACR_NAME.azurecr.io/$IMAGE:${{ github.sha }}"
